[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptwatch"
version = "0.3.0"
description = "Regression testing for LLM prompts"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "google-genai>=0.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.11",
]

[project.scripts]
promptwatch = "promptwatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/promptwatch"]

[tool.ruff]
line-length = 88
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tools"]
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tools.*"]
disallow_untyped_defs = false
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
addopts = "--cov=promptwatch --cov-report=term-missing:skip-covered --cov-fail-under=80"

[tool.coverage.run]
source = ["promptwatch"]
omit = ["*/__main__.py"]
